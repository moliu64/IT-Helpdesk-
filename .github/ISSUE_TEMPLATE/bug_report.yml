name: Bug report
description: 报告可复现的缺陷
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: "Windows 11, Python 3.11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或补充信息
      description: 请先移除 API Key、账号、工单正文等敏感信息。
