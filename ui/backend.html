<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Helpdesk 后端监视</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%231268a5'/%3E%3Ctext%20x='16'%20y='22'%20font-family='system-ui,sans-serif'%20font-size='13'%20font-weight='700'%20text-anchor='middle'%20fill='%23fff'%3EHD%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --nav:#12222e; --nav-top:#1a3343;
      --line:#dbe4e9; --line-soft:#eaf1f4;
      --blue:#1268a5; --blue-dark:#0d517f;
      --ink:#16242d; --muted:#6c7d87;
      --green:#2f9e76; --amber:#d78f3c; --red:#cc5252; --gray:#a9b8c0;
      --node-shadow:0 1px 2px rgba(16,42,58,.06),0 10px 22px -14px rgba(16,42,58,.35);
    }
    * { box-sizing:border-box; }
    body { margin:0; background:#f2f6f8; color:var(--ink); font:14px/1.55 system-ui,"Segoe UI","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    [hidden] { display:none !important; }
    .top { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; color:#fff; background:linear-gradient(180deg,var(--nav-top),var(--nav)); box-shadow:0 6px 18px -14px rgba(0,0,0,.65); }
    .brand { display:flex; align-items:center; gap:10px; font-size:13px; letter-spacing:.08em; }
    .brand-mark { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#1f8ac0,#0f5c8c); font-size:11px; font-weight:700; letter-spacing:.02em; box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
    .brand b { font-size:13px; letter-spacing:.16em; }
    .brand-sub { color:#8fb2c6; font-size:12px; }
    .top-nav { display:flex; align-items:center; gap:10px; }
    .top-nav a { color:#b9d5e5; text-decoration:none; font-size:13px; padding:7px 10px; border-radius:7px; transition:background .18s ease,color .18s ease; }
    .top-nav a:hover { background:rgba(255,255,255,.09); color:#fff; }
    .ghost-btn { background:transparent; border:1px solid rgba(185,213,229,.45); color:#dbeaf3; padding:6px 14px; border-radius:7px; font-size:13px; }
    .ghost-btn:hover { background:rgba(255,255,255,.1); border-color:#b9d5e5; color:#fff; }
    .wrap { max-width:1100px; margin:auto; padding:22px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
    .toolbar select { min-width:360px; flex:1; }
    .toolbar-msg { font-size:12px; color:#b04747; display:inline-flex; align-items:center; gap:6px; }
    input, select, button { font:inherit; }
    input, select { padding:8px 10px; border:1px solid #d3dfe5; border-radius:7px; background:#fff; color:inherit; }
    input:focus, select:focus { outline:2px solid rgba(18,104,165,.2); outline-offset:1px; border-color:#9fc4da; }
    button { border:0; border-radius:7px; background:var(--blue); color:#fff; padding:8px 14px; cursor:pointer; transition:background .18s ease,transform .18s ease; }
    button:hover { background:var(--blue-dark); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .grid > .card { min-width:0; }
    .card { padding:16px; border:1px solid var(--line); border-radius:12px; background:#fff; box-shadow:0 1px 2px rgba(18,45,60,.04),0 14px 30px -26px rgba(18,45,60,.4); }
    .rag, .tickets { grid-column:1 / -1; }
    h2 { margin:0 0 12px; font-size:14px; letter-spacing:.02em; }
    .muted { color:var(--muted); font-size:12px; }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .card-head h2 { margin:0; }
    .card-sub { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .graph-stamp { flex:none; font-size:11px; color:var(--muted); background:#f1f7fa; border:1px solid #e2ebf0; border-radius:999px; padding:3px 9px; white-space:nowrap; }
    .node, .file { display:flex; justify-content:space-between; gap:10px; padding:9px; border-bottom:1px solid var(--line-soft); }
    .graph-canvas {
      position:relative; box-sizing:border-box; min-height:380px; padding:14px; overflow:hidden;
      border:1px solid #d3e0e8; border-radius:12px;
      background-color:#f3f9fc;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(28,66,88,.13) 1px, transparent 1.6px),
        radial-gradient(120% 80% at 12% 0%, rgba(18,104,165,.07), transparent 62%),
        linear-gradient(180deg,#fbfdff 0%, #e9f2f8 100%);
      background-size:16px 16px, 100% 100%, 100% 100%;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -20px 40px -30px rgba(20,55,75,.3);
    }
    .graph-lines { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:1; }
    .graph-lines path { fill:none; stroke:#b9cbd4; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-gray); transition:stroke .25s ease; }
    .graph-lines path.connected { stroke:#2f9e76; marker-end:url(#arrow-green); }
    .graph-lines path.active { stroke:#2f8fc4; stroke-dasharray:5 6; marker-end:url(#arrow-blue); animation:edge-flow .75s linear infinite; }
    .graph-lines path.blocked { stroke:#cc5252; stroke-dasharray:4 5; marker-end:url(#arrow-red); }
    @keyframes edge-flow { to { stroke-dashoffset:-22; } }
    .graph-node {
      position:absolute; z-index:2; width:clamp(70px,26%,124px); min-height:62px; padding:9px 11px;
      display:flex; flex-direction:column; justify-content:center; gap:5px;
      border:1px solid #d6e2e9; border-radius:12px; background:#fff;
      box-shadow:var(--node-shadow);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .graph-node:hover { transform:translateY(-2px); box-shadow:0 2px 4px rgba(16,42,58,.08),0 16px 28px -16px rgba(16,42,58,.4); }
    .gn-title { font-size:13px; font-weight:600; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .gn-meta { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; }
    .gn-dot { flex:none; width:7px; height:7px; border-radius:50%; background:var(--gray); box-shadow:0 0 0 2px rgba(169,184,192,.18); }
    .graph-node.pending { color:#5b6e79; background:linear-gradient(180deg,#ffffff,#f6f9fb); }
    .graph-node.completed { border-color:#bfe4d3; background:linear-gradient(180deg,#ffffff,#ebf9f2); }
    .graph-node.completed .gn-dot { background:var(--green); box-shadow:0 0 0 2px rgba(47,158,118,.18); }
    .graph-node.completed .gn-meta { color:#2b8b6b; }
    .graph-node.running { border-color:#f0cf9f; background:linear-gradient(180deg,#fffefa,#fdf3e4); }
    .graph-node.running .gn-dot { background:var(--amber); box-shadow:0 0 0 2px rgba(215,143,60,.2); animation:pulse 1.15s ease-in-out infinite; }
    .graph-node.running .gn-meta { color:#b5731f; }
    .graph-node.error { border-color:#eec3c3; background:linear-gradient(180deg,#fffdfd,#fdefef); }
    .graph-node.error .gn-dot { background:var(--red); box-shadow:0 0 0 2px rgba(204,82,82,.18); }
    .graph-node.error .gn-meta { color:#b04747; }
    @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(.72); opacity:.65; } }
    .n-parse { left:1%; top:40%; }
    .n-classify { left:37%; top:6%; }
    .n-priority { left:37%; top:40%; }
    .n-solution { left:37%; top:74%; }
    .n-routing { left:73%; top:6%; }
    .n-aggregate { left:73%; top:40%; }
    .graph-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11px; color:var(--muted); }
    .legend-item { display:inline-flex; align-items:center; gap:5px; }
    .legend-dot { width:7px; height:7px; border-radius:50%; }
    .legend-dot.pending { background:var(--gray); }
    .legend-dot.running { background:var(--amber); }
    .legend-dot.completed { background:var(--green); }
    .legend-dot.error { background:var(--red); }
    .event-list { max-height:330px; overflow:auto; }
    .event-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12px; }
    .event-node { min-width:86px; color:var(--ink); }
    .event-state { margin-left:auto; font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap; }
    .event-state.pending { color:#667983; background:#f1f5f7; }
    .event-state.running { color:#a9691a; background:#fdf2e2; }
    .event-state.completed { color:#257a5b; background:#e8f7f0; }
    .event-state.error { color:#a83c3c; background:#fbeaea; }
    .event-time { color:var(--muted); font-size:11px; white-space:nowrap; }
    .rag-status { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
    .metric { padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:#f8fafb; font-size:12px; }
    .metric.err { color:#b04747; background:#fdf3f3; border-color:#efd2d2; }
    .file { align-items:center; gap:10px; }
    .file span:first-child { min-width:0; overflow-wrap:anywhere; }
    .rag-manage {
      display:inline-flex; align-items:center; gap:7px; margin-left:8px; padding:8px 13px;
      border:1px solid #c4d8e4; border-radius:7px; background:#fff; color:var(--blue);
      font-size:13px; font-weight:600; text-decoration:none; vertical-align:middle;
      transition:background .16s ease, border-color .16s ease;
    }
    .rag-manage svg { width:15px; height:15px; }
    .rag-manage:hover { background:#f1f8fc; border-color:#a9c9dc; color:var(--blue-dark); }
    .delete-file { background:#fff; color:#a54141; border:1px solid #e3c5c5; padding:5px 9px; font-size:12px; }
    .delete-file:hover { background:#fdf3f3; color:#8f3333; }
    .ok { color:#2b8c6b; }
    .err { color:#b44b4b; }
    .search-row { display:flex; gap:8px; margin:10px 0; }
    .search-row input { flex:1; min-width:0; }
    input[type="file"] { max-width:100%; }
    .doc-list, .audit-list { max-height:330px; overflow:auto; border-top:1px solid var(--line-soft); }
    .doc-item, .audit-item { padding:10px 0; border-bottom:1px solid var(--line-soft); }
    .doc-item strong, .audit-item strong { display:block; }
    .doc-item small, .audit-item small { display:block; margin-top:4px; color:var(--muted); line-height:1.5; }
    .docs-head { position:sticky; top:0; z-index:1; padding:8px 0 6px; background:#fff; color:var(--muted); font-size:11px; border-bottom:1px solid var(--line-soft); }
    .audit-user { cursor:pointer; }
    .audit-user:hover { background:#f7fafc; }
    .ticket-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 12px; }
    .ticket-toolbar input { flex:1; min-width:220px; }
    .ticket-stats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .ticket-stat { padding:8px 11px; border:1px solid var(--line); border-radius:7px; background:#f8fafb; font-size:12px; }
    .ticket-list { max-height:520px; overflow:auto; border-top:1px solid var(--line-soft); }
    .ticket-item { padding:13px 0; border-bottom:1px solid var(--line-soft); }
    .ticket-main { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .ticket-main strong { display:block; font-size:13px; }
    .ticket-meta { color:var(--muted); font-size:11px; margin-top:5px; line-height:1.6; }
    .ticket-description { color:#465963; font-size:12px; margin:7px 0; white-space:pre-wrap; }
    .ticket-status { border-radius:999px; padding:4px 9px; font-size:11px; white-space:nowrap; }
    .ticket-status.resolved { color:#247d5b; background:#e8f7f0; }
    .ticket-status.unresolved { color:#a56320; background:#fff2df; }
    .ticket-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .ticket-actions select { min-width:110px; }
    .ticket-actions input { flex:1; min-width:220px; }
    .ticket-actions button { padding:7px 10px; }
    .loading { display:flex; align-items:center; gap:8px; padding:8px 0; color:var(--muted); font-size:12px; }
    .loading::before { content:""; width:12px; height:12px; border:2px solid #cfdde4; border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .empty { padding:8px 0; color:var(--muted); font-size:12px; }
    .inline-error { display:flex; flex-wrap:wrap; align-items:center; padding:8px 0; color:#b04747; font-size:12px; line-height:1.6; }
    .retry { margin-left:8px; padding:3px 10px; font-size:11px; color:var(--blue); background:#fff; border:1px solid #c4d8e4; border-radius:6px; }
    .retry:hover { background:#f1f8fc; color:var(--blue-dark); }
    .toast { position:fixed; right:22px; bottom:22px; z-index:50; max-width:340px; padding:10px 14px; border-radius:9px; font-size:12px; color:#fff; background:#2b3d49; box-shadow:0 12px 30px -12px rgba(10,30,45,.6); }
    .toast.ok { background:#1f6f56; }
    .toast.err { background:#a34545; }
    @media (prefers-reduced-motion: reduce) {
      .graph-node { transition:none; }
      .graph-node.running .gn-dot, .graph-lines path.active, .loading::before { animation:none; }
    }
    @media (max-width:760px) {
      .grid { grid-template-columns:1fr; }
      .rag, .tickets { grid-column:auto; }
    }
    @media (max-width:560px) {
      .wrap { padding:14px; }
      .top { padding:0 14px; }
      .brand-sub { display:none; }
      .card { padding:13px; }
      .toolbar select { min-width:0; flex:1 1 100%; }
      .ticket-toolbar input, .ticket-actions input { min-width:0; }
      #file { width:100%; }
      .graph-canvas { min-height:400px; padding:12px; }
      .graph-node { min-height:50px; padding:6px 7px; border-radius:10px; gap:4px; }
      .gn-title { font-size:10px; }
      .gn-meta { font-size:9.5px; gap:4px; }
      .gn-dot { width:6px; height:6px; }
      .event-node { min-width:68px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark">HD</span><b>HELPDESK</b><span class="brand-sub">/ 后端监视</span></div>
    <nav class="top-nav">
      <a href="/">返回对话</a>
      <button id="logout" class="ghost-btn" type="button">退出</button>
    </nav>
  </header>
  <main class="wrap">
    <div class="toolbar">
      <select id="run" aria-label="运行记录"><option value="">暂无运行记录</option></select>
      <button id="load" type="button">刷新运行状态</button>
      <span id="runMsg" class="toolbar-msg" hidden></span>
    </div>
    <div class="grid">
      <section class="card tickets">
        <h2>工单管理</h2>
        <p class="muted">查看用户已提交工单，更新处理状态并记录完成备注，便于后续统计。</p>
        <div id="ticketStats" class="ticket-stats"></div>
        <div class="ticket-toolbar">
          <select id="ticketStatus"><option value="all">全部状态</option><option value="unresolved">未解决</option><option value="resolved">已解决</option></select>
          <input id="ticketQuery" placeholder="搜索工单号、标题、用户或描述">
          <button id="ticketRefresh" type="button">刷新工单</button>
        </div>
        <div id="ticketList" class="ticket-list"><div class="loading">加载中…</div></div>
      </section>
      <section class="card graph-card">
        <div class="card-head">
          <div>
            <h2>LangGraph 流程图</h2>
            <p class="card-sub">四路并行分诊 · 实时状态</p>
          </div>
          <span id="graphStamp" class="graph-stamp">等待数据</span>
        </div>
        <div id="graph" class="graph-canvas">
          <svg id="graphLines" class="graph-lines" aria-hidden="true">
            <defs>
              <marker id="arrow-gray" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0.5,0.6 7.4,4 0.5,7.4" fill="#b9cbd4"></polygon></marker>
              <marker id="arrow-green" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0.5,0.6 7.4,4 0.5,7.4" fill="#2f9e76"></polygon></marker>
              <marker id="arrow-blue" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0.5,0.6 7.4,4 0.5,7.4" fill="#2f8fc4"></polygon></marker>
              <marker id="arrow-red" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0.5,0.6 7.4,4 0.5,7.4" fill="#cc5252"></polygon></marker>
            </defs>
          </svg>
          <div id="nodes"></div>
        </div>
        <div class="graph-legend">
          <span class="legend-item"><i class="legend-dot pending"></i>待运行</span>
          <span class="legend-item"><i class="legend-dot running"></i>运行中</span>
          <span class="legend-item"><i class="legend-dot completed"></i>已完成</span>
          <span class="legend-item"><i class="legend-dot error"></i>异常</span>
        </div>
      </section>
      <section class="card"><h2>事件日志</h2><div id="events" class="event-list muted">暂无数据</div></section>
      <section class="card rag">
        <h2>RAG 库管理</h2>
        <p class="muted">支持 PDF、Word（DOCX）、Markdown、TXT；文本按 15% 上下文重叠切分。</p>
        <input id="file" type="file" accept=".pdf,.docx,.md,.txt">
        <button id="upload" type="button">上传文件</button>
        <button id="rebuild" type="button">重建索引</button>
        <span id="message" class="muted"></span>
        <div id="ragStatus" class="rag-status"></div>
        <div id="files">加载中…</div>
        <a class="rag-manage" id="openRag" href="/rag" target="_blank" rel="noopener" aria-label="管理 RAG 知识库（在新标签页打开）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5c0-1.1.9-2 2-2h5l2 2h5a2 2 0 012 2V18a2 2 0 01-2 2H6a2 2 0 01-2-2z"></path><path d="M8 11h8M8 15h5"></path></svg>
          管理 RAG 知识库
        </a>
        <div class="search-row"><input id="ragQuery" placeholder="输入问题检索知识库和历史工单"><button id="ragSearch" type="button">检索</button></div>
        <div id="ragResults" class="doc-list muted">输入问题后查看 Top-5 匹配结果</div>
      </section>
      <section class="card">
        <h2>用户访问记录</h2>
        <p class="muted">按用户聚合查看最近访问次数、会话数和最后活动时间。</p>
        <div id="auditUsers" class="audit-list"><div class="loading">加载中…</div></div>
        <div class="search-row"><input id="auditUser" placeholder="可选：按用户筛选明细"><button id="auditSearch" type="button">查看记录</button></div>
        <div id="auditLogs" class="audit-list muted">选择用户后查看访问明细</div>
      </section>
    </div>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script>
    (() => {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));

      const STATUS_LABELS = { pending: "待运行", running: "运行中", completed: "已完成", error: "异常" };
      const NODE_DEFS = [
        { key: "parse", label: "解析", position: "n-parse" },
        { key: "classify", label: "分类", position: "n-classify" },
        { key: "priority", label: "优先级 / SLA", position: "n-priority" },
        { key: "solution_retrieval", label: "RAG 检索", position: "n-solution" },
        { key: "routing", label: "路由", position: "n-routing" },
        { key: "aggregate", label: "汇总", position: "n-aggregate" }
      ];
      const EDGE_DEFS = [
        { id: "edge-parse-classify", from: "parse", to: "classify", exit: "right", enter: "left", fromPos: 0.32, bend: 0.34 },
        { id: "edge-parse-priority", from: "parse", to: "priority", exit: "right", enter: "left" },
        { id: "edge-parse-solution", from: "parse", to: "solution_retrieval", exit: "right", enter: "left", fromPos: 0.68, bend: 0.66 },
        { id: "edge-classify-routing", from: "classify", to: "routing", exit: "right", enter: "left" },
        { id: "edge-priority-aggregate", from: "priority", to: "aggregate", exit: "right", enter: "left" },
        { id: "edge-solution-aggregate", from: "solution_retrieval", to: "aggregate", exit: "right", enter: "bottom" },
        { id: "edge-routing-aggregate", from: "routing", to: "aggregate", exit: "bottom", enter: "top" }
      ];
      const nodeLabel = (key) => {
        const def = NODE_DEFS.find((item) => item.key === key);
        return def ? def.label : key;
      };

      const nodeEls = {};
      const edgeEls = {};
      let authRedirecting = false;
      let pollTimer = null;
      let pollBusy = false;
      let drawQueued = false;
      let auditUser = "";
      let toastTimer = null;

      /* ---------- API helper: 401 -> /login, errors surfaced inline by callers ---------- */
      function redirectToLogin() {
        if (authRedirecting) return;
        authRedirecting = true;
        stopPolling();
        location.replace("/login?next=" + encodeURIComponent(location.pathname || "/backend"));
      }

      async function apiJson(url, options = {}) {
        const response = await fetch(url, { credentials: "same-origin", ...options });
        let resolvedUrl = "";
        try { resolvedUrl = new URL(response.url, location.href).pathname; } catch (error) { resolvedUrl = ""; }
        if (response.redirected && resolvedUrl === "/login") {
          redirectToLogin();
          throw new Error("登录已过期，请重新登录");
        }
        const raw = await response.text();
        let data = null;
        if (raw) {
          try { data = JSON.parse(raw); } catch (error) { data = null; }
        }
        if (response.status === 401) {
          redirectToLogin();
          throw new Error((data && data.error) || "登录已过期，请重新登录");
        }
        if (!response.ok) {
          const error = new Error((data && (data.error || data.message)) || `请求失败（HTTP ${response.status}）`);
          error.status = response.status;
          throw error;
        }
        return data;
      }

      function runSafely(fn) {
        return (...args) => {
          try {
            const result = fn(...args);
            if (result && typeof result.catch === "function") result.catch((error) => console.error(error));
          } catch (error) {
            console.error(error);
          }
        };
      }

      function showToast(text, type = "ok") {
        const el = $("toast");
        if (!el) return;
        el.textContent = String(text);
        el.className = `toast ${type}`;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.hidden = true; }, 4200);
      }

      /* ---------- Flowchart: measured SVG overlay ---------- */
      function buildGraph() {
        const wrap = $("nodes");
        wrap.innerHTML = NODE_DEFS.map((def) =>
          `<div class="graph-node pending ${def.position}" data-node="${def.key}"><div class="gn-title">${esc(def.label)}</div><div class="gn-meta"><span class="gn-dot"></span><span class="gn-state" data-role="state">待运行</span></div></div>`
        ).join("");
        NODE_DEFS.forEach((def) => { nodeEls[def.key] = wrap.querySelector(`[data-node="${def.key}"]`); });
        const svg = $("graphLines");
        EDGE_DEFS.forEach((def) => {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("id", def.id);
          path.setAttribute("class", "pending");
          path.setAttribute("d", "");
          svg.appendChild(path);
          edgeEls[def.id] = path;
        });
      }

      function scheduleDraw() {
        if (drawQueued) return;
        drawQueued = true;
        requestAnimationFrame(() => { drawQueued = false; drawEdges(); });
      }

      function pointOnSide(rect, side, pos, gap) {
        switch (side) {
          case "left": return { x: rect.x - gap, y: rect.y + rect.h * pos };
          case "right": return { x: rect.x + rect.w + gap, y: rect.y + rect.h * pos };
          case "top": return { x: rect.x + rect.w * pos, y: rect.y - gap };
          default: return { x: rect.x + rect.w * pos, y: rect.y + rect.h + gap };
        }
      }

      function edgePoints(startRect, endRect, def, gap) {
        const start = pointOnSide(startRect, def.exit, def.fromPos == null ? 0.5 : def.fromPos, gap);
        const end = pointOnSide(endRect, def.enter, def.toPos == null ? 0.5 : def.toPos, gap);
        const points = [start];
        const bend = def.bend == null ? 0.5 : def.bend;
        if (def.exit === "right" && def.enter === "left") {
          if (Math.abs(end.y - start.y) < 0.75) { points.push(end); return points; }
          const midX = start.x + (end.x - start.x) * bend;
          points.push({ x: midX, y: start.y }, { x: midX, y: end.y }, end);
        } else if (def.exit === "bottom" && def.enter === "top") {
          if (Math.abs(end.x - start.x) < 0.75) { points.push(end); return points; }
          const midY = start.y + (end.y - start.y) * bend;
          points.push({ x: start.x, y: midY }, { x: end.x, y: midY }, end);
        } else if (def.exit === "right" && (def.enter === "bottom" || def.enter === "top")) {
          points.push({ x: end.x, y: start.y }, end);
        } else if (def.exit === "bottom" && def.enter === "left") {
          points.push({ x: start.x, y: end.y }, end);
        } else {
          points.push(end);
        }
        return points;
      }

      function roundedPath(points, radius) {
        const pts = [];
        points.forEach((point) => {
          const last = pts[pts.length - 1];
          if (last && Math.abs(last.x - point.x) < 0.5 && Math.abs(last.y - point.y) < 0.5) return;
          pts.push(point);
        });
        if (pts.length === 0) return "";
        const fmt = (value) => (Math.round(value * 10) / 10).toString();
        if (pts.length < 3) return `M ${fmt(pts[0].x)} ${fmt(pts[0].y)} L ${fmt(pts[pts.length - 1].x)} ${fmt(pts[pts.length - 1].y)}`;
        let d = `M ${fmt(pts[0].x)} ${fmt(pts[0].y)}`;
        for (let i = 1; i < pts.length - 1; i += 1) {
          const prev = pts[i - 1];
          const cur = pts[i];
          const next = pts[i + 1];
          const lenIn = Math.hypot(cur.x - prev.x, cur.y - prev.y);
          const lenOut = Math.hypot(next.x - cur.x, next.y - cur.y);
          const r = Math.min(radius, lenIn / 2, lenOut / 2);
          if (r < 1.2) { d += ` L ${fmt(cur.x)} ${fmt(cur.y)}`; continue; }
          const inX = cur.x - ((cur.x - prev.x) / lenIn) * r;
          const inY = cur.y - ((cur.y - prev.y) / lenIn) * r;
          const outX = cur.x + ((next.x - cur.x) / lenOut) * r;
          const outY = cur.y + ((next.y - cur.y) / lenOut) * r;
          d += ` L ${fmt(inX)} ${fmt(inY)} Q ${fmt(cur.x)} ${fmt(cur.y)} ${fmt(outX)} ${fmt(outY)}`;
        }
        const last = pts[pts.length - 1];
        d += ` L ${fmt(last.x)} ${fmt(last.y)}`;
        return d;
      }

      function drawEdges() {
        const svg = $("graphLines");
        const base = svg.getBoundingClientRect();
        if (!base.width || !base.height) return;
        const rects = {};
        NODE_DEFS.forEach((def) => {
          const el = nodeEls[def.key];
          if (!el) return;
          const rect = el.getBoundingClientRect();
          rects[def.key] = { x: rect.left - base.left, y: rect.top - base.top, w: rect.width, h: rect.height };
        });
        const gap = base.width < 380 ? 8 : 10;
        EDGE_DEFS.forEach((def) => {
          const path = edgeEls[def.id];
          const start = rects[def.from];
          const end = rects[def.to];
          if (!path || !start || !end) return;
          path.setAttribute("d", roundedPath(edgePoints(start, end, def, gap), 7));
        });
      }

      function latestByNode(events) {
        const latest = {};
        (Array.isArray(events) ? events : []).forEach((event) => {
          if (event && typeof event.node === "string") latest[event.node] = event;
        });
        return latest;
      }

      function applyEdgeStates(latest) {
        EDGE_DEFS.forEach((def) => {
          const path = edgeEls[def.id];
          if (!path) return;
          const fromStatus = (latest[def.from] && latest[def.from].status) || "pending";
          const toStatus = (latest[def.to] && latest[def.to].status) || "pending";
          let cls = "pending";
          if (fromStatus === "error" || toStatus === "error") cls = "blocked";
          else if (fromStatus === "running" || toStatus === "running") cls = "active";
          else if (fromStatus === "completed" && toStatus === "completed") cls = "connected";
          path.setAttribute("class", cls);
        });
      }

      function updateNodes(events) {
        const latest = latestByNode(events);
        NODE_DEFS.forEach((def) => {
          const el = nodeEls[def.key];
          if (!el) return;
          const event = latest[def.key];
          const status = event && STATUS_LABELS[event.status] ? event.status : "pending";
          el.className = `graph-node ${def.position} ${status}`;
          const state = el.querySelector('[data-role="state"]');
          if (state) {
            const count = event && event.result_count != null ? ` · ${event.result_count} 条` : "";
            state.textContent = `${STATUS_LABELS[status]}${count}`;
          }
          el.title = event ? `${def.label} · ${STATUS_LABELS[status]}${event.timestamp ? ` · ${event.timestamp}` : ""}` : `${def.label} · 待运行`;
        });
        applyEdgeStates(latest);
        scheduleDraw();
      }

      function setGraphStamp(text) {
        const el = $("graphStamp");
        if (el) el.textContent = text;
      }

      function renderEvents(events) {
        const box = $("events");
        const list = Array.isArray(events) ? events : [];
        if (!list.length) {
          box.className = "event-list muted";
          box.textContent = "暂无数据";
          return;
        }
        box.className = "event-list";
        box.innerHTML = list.map((event) => {
          const status = STATUS_LABELS[event.status] ? event.status : "pending";
          return `<div class="event-row"><span class="event-node">${esc(nodeLabel(event.node))}</span><span class="event-state ${status}">${esc(STATUS_LABELS[status])}</span><span class="event-time">${esc(event.timestamp || "")}</span></div>`;
        }).join("");
      }

      function setRunMessage(text, showRetry) {
        const el = $("runMsg");
        if (!el) return;
        el.hidden = !text;
        el.innerHTML = text ? `${esc(text)}${showRetry ? '<button type="button" class="retry" data-retry="runs">重试</button>' : ""}` : "";
      }

      async function refreshRuns(selectLatest) {
        try {
          const runs = await apiJson("/api/backend/runs");
          const list = Array.isArray(runs) ? runs : [];
          const previous = $("run").value;
          $("run").innerHTML = list.length ? list.map((run) => {
            const user = String(run.user_id || "");
            const session = String(run.session_id || "");
            const label = `${run.updated_at || ""} · ${user || "未知用户"} · ${session.slice(0, 24) || "无会话"} · ${run.event_count == null ? 0 : run.event_count} events`;
            return `<option value="${esc(encodeURIComponent(user))}|${esc(encodeURIComponent(session))}">${esc(label)}</option>`;
          }).join("") : '<option value="">暂无运行记录</option>';
          if (!selectLatest && previous && Array.from($("run").options).some((option) => option.value === previous)) {
            $("run").value = previous;
          }
          setRunMessage("", false);
          if ($("run").value) await loadTrace();
          else {
            updateNodes([]);
            renderEvents([]);
            setGraphStamp("暂无数据");
          }
        } catch (error) {
          setRunMessage(`运行状态加载失败：${error.message}`, true);
        }
      }

      async function loadTrace() {
        const selected = $("run").value;
        if (!selected) {
          updateNodes([]);
          renderEvents([]);
          setGraphStamp("暂无数据");
          return;
        }
        const [user, session] = selected.split("|").map((part) => {
          try { return decodeURIComponent(part); } catch (error) { return part; }
        });
        try {
          /* 管理端令牌走 /api/backend/trace；/api/trace 是用户路由，需要聊天身份 cookie，管理员浏览器没有。 */
          const events = await apiJson(`/api/backend/trace?user_id=${encodeURIComponent(user)}&session_id=${encodeURIComponent(session)}`);
          const list = Array.isArray(events) ? events : [];
          updateNodes(list);
          renderEvents(list);
          setGraphStamp(`实时 · ${new Date().toLocaleTimeString("zh-CN", { hour12: false })}`);
        } catch (error) {
          const hint = error.status === 404 ? "（事件接口 /api/backend/trace 未就绪）" : "";
          $("events").innerHTML = `<div class="inline-error">事件加载失败：${esc(error.message)}${esc(hint)}<button type="button" class="retry" data-retry="trace">重试</button></div>`;
          setGraphStamp("加载失败");
        }
      }

      /* ---------- Tickets ---------- */
      function ticketStatusLabel(status) { return status === "resolved" ? "已解决" : "未解决"; }

      function renderTicketStats(stats) {
        const data = stats || {};
        $("ticketStats").innerHTML = `<span class="ticket-stat">全部 ${esc(data.all || 0)}</span><span class="ticket-stat">未解决 ${esc(data.unresolved || 0)}</span><span class="ticket-stat">已解决 ${esc(data.resolved || 0)}</span>`;
      }

      function renderTickets(tickets) {
        const list = Array.isArray(tickets) ? tickets : [];
        $("ticketList").innerHTML = list.length ? list.map((ticket) => {
          const report = ticket.report || {};
          return `<article class="ticket-item">
            <div class="ticket-main"><div><strong>${esc(ticket.ticket_id)} · ${esc(ticket.title)}</strong><div class="ticket-meta">${esc(ticket.user_id || "未知用户")} · ${esc(ticket.created_at)} · ${esc(ticket.category)} / ${esc(ticket.subcategory)} · ${esc(ticket.priority)} · ${esc(ticket.team)}</div></div><span class="ticket-status ${esc(ticket.status)}">${esc(ticketStatusLabel(ticket.status))}</span></div>
            <div class="ticket-description">${esc(ticket.description || "暂无描述")}</div>
            <details><summary class="muted">查看分诊报告与处理建议</summary><div class="ticket-description">用户回复草稿：${esc(report.user_reply_draft || "暂无")}</div><div class="ticket-description">工程师建议：${esc(report.engineer_advice || "暂无")}</div></details>
            <div class="ticket-meta">当前备注：${esc(ticket.resolution_note || "暂无")}${ticket.status_updated_at ? ` · 最近更新 ${esc(ticket.status_updated_at)}` : ""}</div>
            <div class="ticket-actions"><select data-ticket-status="${esc(ticket.ticket_id)}"><option value="unresolved" ${ticket.status === "unresolved" ? "selected" : ""}>未解决</option><option value="resolved" ${ticket.status === "resolved" ? "selected" : ""}>已解决</option></select><input data-ticket-note="${esc(ticket.ticket_id)}" value="${esc(ticket.resolution_note || "")}" placeholder="填写处理备注（如：已重置密码并回访确认）"><button type="button" data-ticket-save="${esc(ticket.ticket_id)}">保存状态与备注</button></div>
          </article>`;
        }).join("") : '<div class="empty">暂无符合条件的工单</div>';
        document.querySelectorAll("[data-ticket-save]").forEach((button) => {
          button.onclick = runSafely(() => updateTicket(button.dataset.ticketSave));
        });
      }

      async function refreshTickets() {
        const status = $("ticketStatus").value;
        const query = $("ticketQuery").value.trim();
        $("ticketList").innerHTML = '<div class="loading">加载中…</div>';
        try {
          const data = await apiJson(`/api/tickets?status=${encodeURIComponent(status)}&q=${encodeURIComponent(query)}`);
          renderTicketStats(data && data.stats);
          renderTickets(data && data.tickets);
        } catch (error) {
          $("ticketStats").innerHTML = "";
          $("ticketList").innerHTML = `<div class="inline-error">工单加载失败：${esc(error.message)}<button type="button" class="retry" data-retry="tickets">重试</button></div>`;
        }
      }

      async function updateTicket(ticketId) {
        const statusSelect = document.querySelector(`[data-ticket-status="${CSS.escape(ticketId)}"]`);
        const noteInput = document.querySelector(`[data-ticket-note="${CSS.escape(ticketId)}"]`);
        const button = document.querySelector(`[data-ticket-save="${CSS.escape(ticketId)}"]`);
        const status = statusSelect ? statusSelect.value : "unresolved";
        const note = noteInput ? noteInput.value.trim() : "";
        if (button) button.disabled = true;
        try {
          await apiJson("/api/tickets/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ticket_id: ticketId, status, resolution_note: note })
          });
          showToast("工单状态与备注已更新。", "ok");
          await refreshTickets();
        } catch (error) {
          showToast(`工单更新失败：${error.message}`, "err");
        } finally {
          if (button) button.disabled = false;
        }
      }

      /* ---------- RAG ---------- */
      function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const result = String(reader.result || "");
            const comma = result.indexOf(",");
            resolve(comma >= 0 ? result.slice(comma + 1) : "");
          };
          reader.onerror = () => reject(new Error("文件读取失败"));
          reader.readAsDataURL(file);
        });
      }

      function editableMessage(text, isError) {
        const el = $("message");
        el.textContent = text;
        el.className = isError ? "muted err" : "muted";
      }

      async function refreshFiles() {
        const filesBox = $("files");
        const statusBox = $("ragStatus");
        filesBox.innerHTML = '<div class="loading">加载中…</div>';
        statusBox.innerHTML = "";
        const [filesResult, statusResult] = await Promise.allSettled([apiJson("/api/rag/files"), apiJson("/api/rag/status")]);
        const statusError = statusResult.status === "rejected" ? statusResult.reason : null;
        if (statusError) {
          statusBox.innerHTML = `<span class="metric err">索引状态加载失败：${esc(statusError.message)}</span>`;
        } else {
          const status = statusResult.value || {};
          statusBox.innerHTML = `<span class="metric">索引：${status.ready ? "就绪" : "未构建"}</span><span class="metric">源文档：${esc(status.source_documents == null ? 0 : status.source_documents)}</span><span class="metric">已索引：${esc(status.indexed_documents == null ? 0 : status.indexed_documents)}</span><span class="metric">知识条：${esc(status.managed_entries == null ? 0 : status.managed_entries)}</span>`;
        }
        if (filesResult.status === "rejected") {
          filesBox.innerHTML = `<div class="inline-error">文件列表加载失败：${esc(filesResult.reason.message)}<button type="button" class="retry" data-retry="files">重试</button></div>`;
          return;
        }
        const files = Array.isArray(filesResult.value) ? filesResult.value : [];
        filesBox.innerHTML = files.length ? files.map((file) => `<div class="file"><span>${esc(file.name)} <small class="muted">${esc(file.size == null ? 0 : file.size)} bytes</small></span><button type="button" class="delete-file" data-file="${esc(file.name)}">删除</button></div>`).join("") : '<div class="empty">暂无导入文件，可上传文档后重建索引</div>';
        document.querySelectorAll("[data-file]").forEach((button) => {
          button.onclick = runSafely(async () => {
            const name = button.dataset.file;
            if (!confirm(`删除 ${name}？`)) return;
            button.disabled = true;
            try {
              await apiJson(`/api/rag/files?name=${encodeURIComponent(name)}`, { method: "DELETE" });
              editableMessage("文件已删除，请重建索引。", false);
            } catch (error) {
              editableMessage(`删除失败：${error.message}`, true);
            } finally {
              button.disabled = false;
              await refreshFiles();
            }
          });
        });
      }

      function renderMatches(matches) {
        return matches.map((match) => {
          const steps = Array.isArray(match.steps) ? match.steps : [];
          const stepsHtml = steps.length ? steps.map((step, index) => `${index + 1}. ${esc(step)}`).join("<br>") : "未提取步骤";
          return `<div class="doc-item"><strong>${esc(match.source)} · ${esc(match.title)}</strong><small>相关度：${esc(match.relevance)}</small><small>${stepsHtml}</small></div>`;
        }).join("");
      }

      async function searchRag() {
        const query = $("ragQuery").value.trim();
        if (!query) { $("ragResults").innerHTML = '<div class="empty">请输入检索问题。</div>'; return; }
        const button = $("ragSearch");
        button.disabled = true;
        $("ragResults").innerHTML = '<div class="loading">检索中…</div>';
        try {
          const data = await apiJson("/api/rag/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query }) });
          const matches = data && Array.isArray(data.matches) ? data.matches : [];
          $("ragResults").innerHTML = matches.length ? renderMatches(matches) : '<div class="empty">未找到匹配内容，建议调整关键词。</div>';
        } catch (error) {
          $("ragResults").innerHTML = `<div class="inline-error">检索失败：${esc(error.message)}</div>`;
        } finally {
          button.disabled = false;
        }
      }

      /* ---------- Audit ---------- */
      function renderAuditUsers(users) {
        const list = Array.isArray(users) ? users : [];
        $("auditUsers").innerHTML = list.length ? list.map((user) => `<div class="audit-item audit-user" data-user="${esc(user.user_id)}"><strong>${esc(user.user_id)}</strong><small>${esc(user.access_count)} 次访问 · ${esc(user.sessions)} 个会话 · 最后活动 ${esc(user.last_seen)}</small></div>`).join("") : '<div class="empty">暂无已识别用户访问记录</div>';
        document.querySelectorAll("[data-user]").forEach((item) => {
          item.onclick = runSafely(() => refreshAudit(item.dataset.user));
        });
      }

      function renderAuditLogs(logs) {
        const list = Array.isArray(logs) ? logs : [];
        $("auditLogs").innerHTML = list.length ? list.map((log) => `<div class="audit-item"><strong>${esc(log.method)} ${esc(log.path)}</strong><small>${esc(log.user_id)} · ${esc(log.session_id || "无会话")} · ${esc(log.created_at)}</small></div>`).join("") : '<div class="empty">暂无访问明细</div>';
      }

      async function refreshAudit(userId) {
        const target = typeof userId === "string" ? userId : "";
        auditUser = target;
        const [usersResult, logsResult] = await Promise.allSettled([
          apiJson("/api/audit/users"),
          apiJson(`/api/audit/logs?user_id=${encodeURIComponent(target)}`)
        ]);
        if (usersResult.status === "fulfilled") renderAuditUsers(usersResult.value);
        else $("auditUsers").innerHTML = `<div class="inline-error">用户列表加载失败：${esc(usersResult.reason.message)}<button type="button" class="retry" data-retry="audit">重试</button></div>`;
        if (logsResult.status === "fulfilled") renderAuditLogs(logsResult.value);
        else $("auditLogs").innerHTML = `<div class="inline-error">访问明细加载失败：${esc(logsResult.reason.message)}<button type="button" class="retry" data-retry="audit">重试</button></div>`;
      }

      /* ---------- Polling ---------- */
      function startPolling() {
        stopPolling();
        pollTimer = setInterval(runSafely(async () => {
          if (authRedirecting || pollBusy) return;
          pollBusy = true;
          try {
            await refreshRuns(false);
          } finally {
            pollBusy = false;
          }
        }), 5000);
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      /* ---------- Wiring ---------- */
      const retryHandlers = {
        runs: () => refreshRuns(false),
        trace: () => loadTrace(),
        tickets: () => refreshTickets(),
        files: () => refreshFiles(),
        audit: () => refreshAudit(auditUser),
        rag: () => searchRag()
      };

      document.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target.closest("[data-retry]") : null;
        if (!target) return;
        const handler = retryHandlers[target.dataset.retry];
        if (!handler) return;
        event.preventDefault();
        runSafely(handler)();
      });

      $("load").onclick = runSafely(() => refreshRuns(false));
      $("run").onchange = runSafely(() => loadTrace());
      $("ticketRefresh").onclick = runSafely(() => refreshTickets());
      $("ticketStatus").onchange = runSafely(() => refreshTickets());
      $("ticketQuery").onkeydown = (event) => { if (event.key === "Enter") runSafely(() => refreshTickets())(); };
      $("ragSearch").onclick = runSafely(() => searchRag());
      $("ragQuery").onkeydown = (event) => { if (event.key === "Enter") runSafely(() => searchRag())(); };
      $("auditSearch").onclick = runSafely(() => refreshAudit($("auditUser").value.trim()));

      $("upload").onclick = runSafely(async () => {
        const input = $("file");
        const file = input.files && input.files[0];
        if (!file) { editableMessage("请先选择文件。", true); return; }
        const button = $("upload");
        button.disabled = true;
        editableMessage(`正在上传 ${file.name}…`, false);
        try {
          const contentBase64 = await readFileAsBase64(file);
          const data = await apiJson("/api/rag/import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: file.name, content_base64: contentBase64 })
          });
          const chunks = data && data.chunks != null ? data.chunks : (data && data.indexed != null ? data.indexed : null);
          editableMessage(chunks != null ? `已导入 ${chunks} 条知识并重建索引。` : "上传成功，已重建索引。", false);
          input.value = "";
          await refreshFiles();
        } catch (error) {
          editableMessage(`上传失败：${error.message}`, true);
        } finally {
          button.disabled = false;
        }
      });

      $("rebuild").onclick = runSafely(async () => {
        const button = $("rebuild");
        button.disabled = true;
        editableMessage("重建中…", false);
        try {
          const data = await apiJson("/api/rag/rebuild", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
          const count = data && data.count != null ? data.count : (data && data.stats && data.stats.entries != null ? data.stats.entries : null);
          editableMessage(count != null ? `索引已更新，共 ${count} 条。` : "索引已更新。", false);
          await refreshFiles();
        } catch (error) {
          editableMessage(`重建失败：${error.message}`, true);
        } finally {
          button.disabled = false;
        }
      });

      $("logout").onclick = runSafely(async () => {
        const button = $("logout");
        button.disabled = true;
        button.textContent = "退出中…";
        try {
          await fetch("/api/admin/logout", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: "{}" });
        } catch (error) {
          /* 退出接口失败也直接回登录页 */
        } finally {
          location.href = "/login";
        }
      });

      window.addEventListener("resize", scheduleDraw);
      if (window.ResizeObserver) new ResizeObserver(scheduleDraw).observe($("graph"));
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleDraw).catch(() => {});

      buildGraph();
      updateNodes([]);
      startPolling();
      refreshRuns(true);
      refreshFiles();
      refreshAudit("");
      refreshTickets();
    })();
  </script>
</body>
</html>
