<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helpdesk Agent</title><style>
:root{--nav:#132633;--nav2:#1d3949;--bg:#f5f7f8;--line:#dbe3e7;--muted:#71808a;--blue:#1268a5;--orange:#f09a4c}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif;color:#17232c}.app{height:100dvh;width:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 320px;overflow:hidden}.side{height:100%;min-height:0;overflow:hidden;background:var(--nav);color:#edf5f8;padding:18px 14px;display:flex;flex-direction:column}.brand{font-weight:700;padding:8px;margin-bottom:16px}.brand small{display:block;color:#9eb0b9;font-size:10px}.new,.import{width:100%;padding:10px;background:transparent;border:1px solid #3d5665;border-radius:6px;color:#fff;text-align:left;cursor:pointer}.label{margin:20px 8px 8px;color:#81949e;font-size:10px;letter-spacing:.12em}.sessions{overflow-y:auto;min-height:0}.session{display:flex;align-items:center;gap:4px;padding:7px;border-radius:6px}.session:hover{background:var(--nav2)}.session-main{min-width:0;flex:1;background:transparent;border:0;color:#dce7eb;text-align:left;cursor:pointer}.session strong,.session small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.session strong{font-size:12px}.session small{font-size:10px;color:#8fa3ad}.delete-session{background:transparent;border:0;color:#8fa3ad;cursor:pointer}.skills{border-top:1px solid #304653;margin-top:12px;padding-top:10px}.skill{font-size:12px;margin:6px}.foot{margin-top:auto;border-top:1px solid #304653;padding:12px 8px;color:#8fa3ad;font-size:10px}.chat{height:100%;min-width:0;min-height:0;display:grid;grid-template-rows:62px minmax(0,1fr) auto;overflow:hidden}.head{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.head h1{font:600 17px Georgia,serif}.identity{color:var(--muted);font-size:11px}.messages{min-height:0;overflow-y:auto;overflow-x:hidden;padding:30px clamp(22px,7vw,100px);overscroll-behavior:contain}.welcome{max-width:680px;margin:12vh auto}.welcome h2{font:500 42px Georgia,serif;margin:12px 0}.welcome p{color:var(--muted)}.suggestions{display:flex;gap:8px;flex-wrap:wrap}.suggestion{padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:6px;color:#49616d;cursor:pointer}.message{max-width:720px;margin:0 auto 22px;display:flex;gap:10px}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:10px;white-space:pre-line;overflow-wrap:anywhere}.assistant .bubble{background:#fff;border:1px solid var(--line)}.user .bubble{background:var(--blue);color:#fff}.avatar{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10px;background:var(--orange);flex:none}.user .avatar{order:2;background:#dbeaf5;color:var(--blue)}.composer{min-height:100px;padding:16px clamp(22px,7vw,100px) 20px;background:#fff;border-top:1px solid var(--line);z-index:2}.compose{max-width:720px;margin:auto;display:flex;gap:9px}.compose textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}.send{width:44px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-size:17px}.monitor{height:100%;min-height:0;overflow:hidden;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column}.monitor-head,.graph,.skills-state{padding:16px 18px;border-bottom:1px solid var(--line)}.monitor-head h2{font-size:13px;margin:0}.monitor-head p,.cap{font-size:10px;color:var(--muted)}.nodes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.node{border:1px solid var(--line);border-radius:6px;padding:7px;font-size:11px}.node.running{border-color:var(--orange);background:#fff8ef}.node.completed{border-color:#a9dbc8;background:#f2fbf7}.node small{display:block;color:var(--muted);font-size:9px}.trace{padding:9px 18px;overflow:auto;min-height:0;flex:1}.trace-row{font-size:10px;padding:6px 0;border-bottom:1px solid #eef2f4}.trace-row b{display:inline-block;width:92px}.trace-row span{color:var(--muted)}.status{margin:0 18px 16px;padding:10px;border:1px solid var(--line);border-radius:7px;font-size:12px}@media(max-width:1050px){.app{grid-template-columns:230px minmax(0,1fr)}.monitor{display:none}}@media(max-width:720px){.app{display:block;height:100dvh}.side{display:none}.chat{height:100dvh}.messages{padding:20px 14px}.composer{padding:12px 14px}.welcome h2{font-size:32px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">HELPDESK AGENT<small>可观测运维智能体</small></div><button class="new" id="newChat">＋ 新对话</button><div class="label">历史对话</div><div class="sessions" id="sessions"></div><div class="skills"><div class="label">SKILLS</div><div id="skillList"></div><button class="import" id="importSkill">导入 Skill</button></div><div class="foot">会话按用户与 session 隔离。</div></aside><main class="chat"><header class="head"><h1>Helpdesk Agent</h1><div class="identity" id="identity">未登录用户</div></header><section class="messages" id="messages"><div class="welcome" id="welcome"><div style="color:#1268a5;font-size:10px;letter-spacing:.14em">AGENT CONVERSATION</div><h2>今天需要我帮你排查什么？</h2><p>我会先理解你的意图，再选择对话、知识库排查或工单流程。</p><div class="suggestions"><button class="suggestion">VPN 连接不上怎么办？</button><button class="suggestion">帮我分诊这条工单</button><button class="suggestion">如何申请共享盘权限？</button></div></div></section><footer class="composer"><div class="compose"><textarea id="input" placeholder="给 Helpdesk Agent 发消息…"></textarea><button class="send" id="send">↑</button></div></footer></main><aside class="monitor"><div class="monitor-head"><h2>Agent monitor</h2><p>意图识别、对话与 RAG 流程</p></div><div class="graph"><div class="cap">流程状态</div><div class="nodes" id="graphNodes"></div></div><div class="skills-state"><div class="cap">当前 Skills</div><div id="skillContext">未启用自定义 Skill</div></div><div class="trace" id="traceList"></div><div class="status"><div class="cap">运行状态</div><div id="runState">Ready</div></div></aside></div><script>
const $=id=>document.getElementById(id),labels={intent:'意图识别',parse:'解析',solution_retrieval:'RAG 检索',conversation:'对话',classify:'分类',priority:'优先级',routing:'路由',aggregate:'汇总'};let userId=localStorage.getItem('helpdesk_user')||'',sessionId=crypto.randomUUID();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function bubble(role,text){let d=document.createElement('div');d.className='message '+role;d.innerHTML=`<div class="avatar">${role==='user'?'你':'AI'}</div><div class="bubble">${esc(text)}</div>`;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}function renderTrace(a=[]){let last={};a.forEach(x=>last[x.node]=x);$('graphNodes').innerHTML=Object.keys(labels).map(k=>{let x=last[k]||{status:'待运行'};return `<div class="node ${esc(x.status)}"><b>${labels[k]}</b><small>${esc(x.status)}${x.intent?' · '+esc(x.intent):''}</small></div>`}).join('');$('traceList').innerHTML=a.map(x=>`<div class="trace-row"><b>${labels[x.node]||x.node}</b><span>${esc(x.status)}${x.result_count!=null?' · '+x.result_count+' 条':''}</span></div>`).join('')}async function sessions(){if(!userId)return;$('identity').textContent='用户 · '+userId;let a=await fetch('/api/sessions?user_id='+encodeURIComponent(userId)).then(r=>r.json());$('sessions').innerHTML=a.map(x=>`<div class="session"><button class="session-main" data-id="${esc(x.session_id)}"><strong>${esc((x.summary||'新对话').slice(0,36))}</strong><small>${x.message_count} 条消息 · ${esc(x.updated_at)}</small></button><button class="delete-session" data-delete="${esc(x.session_id)}" title="删除">×</button></div>`).join('');document.querySelectorAll('.session-main').forEach(b=>b.onclick=()=>load(b.dataset.id));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeSession(b.dataset.delete))}async function removeSession(id){if(!confirm('删除这段历史对话？'))return;let r=await fetch(`/api/sessions?user_id=${encodeURIComponent(userId)}&session_id=${encodeURIComponent(id)}`,{method:'DELETE'});if(!r.ok){alert('删除失败，请重启最新版本服务后重试');return}if(sessionId===id){sessionId=crypto.randomUUID();document.querySelectorAll('.message').forEach(x=>x.remove());$('welcome').style.display='block';renderTrace([])}sessions()}async function load(id){sessionId=id;$('welcome').style.display='none';document.querySelectorAll('.message').forEach(x=>x.remove());let a=await fetch(`/api/messages?user_id=${encodeURIComponent(userId)}&session_id=${encodeURIComponent(id)}`).then(r=>r.json());a.forEach(x=>bubble(x.role==='user'?'user':'assistant',x.content));renderTrace(await fetch(`/api/trace?user_id=${encodeURIComponent(userId)}&session_id=${encodeURIComponent(id)}`).then(r=>r.json()))}async function send(){let text=$('input').value.trim();if(!text)return;if(!userId){userId=prompt('请输入用户标识')?.trim()||'';if(!userId)return;localStorage.setItem('helpdesk_user',userId)}$('welcome').style.display='none';bubble('user',text);$('input').value='';$('send').disabled=true;$('runState').textContent='Agent 处理中…';renderTrace([{node:'intent',status:'running'}]);try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,session_id:sessionId,message:text})}),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');bubble('assistant',d.reply);renderTrace(d.trace||[]);$('runState').textContent=d.intent?.intent||'已完成';sessions()}catch(e){bubble('assistant','请求失败：'+e.message);$('runState').textContent='运行失败'}finally{$('send').disabled=false}}$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('input').value=b.textContent;send()});$('newChat').onclick=()=>{sessionId=crypto.randomUUID();document.querySelectorAll('.message').forEach(x=>x.remove());$('welcome').style.display='block';renderTrace([]);$('runState').textContent='Ready'};if(!userId){userId=prompt('请输入用户标识')?.trim()||'';if(userId)localStorage.setItem('helpdesk_user',userId)}sessions();renderTrace([]);
</script></body></html>
